[pytest]
# Without this, "the full suite" means different things to different people.
# Bare `pytest` at the repo root walks postraining/runs/, which holds training
# output -- and a run writes provenance copies of test files in there, whose
# basenames collide with the real modules. For nineteen minutes on 2026-07-25
# that made repo-root collection ERROR and collect zero tests, so two agents
# reporting on "the full suite" either side of that window were running
# genuinely different test sets and disagreeing about the result.
testpaths = postraining/tests
norecursedirs = postraining/runs worktrees data logs ablation_results tb_logs .git
